version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://novivet_user:novivet_secret_pwd@db:5432/novivet_db
      - JWT_SECRET=novivet-super-secure-production-clinical-jwt-secret-key-2026
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=novivet_user
      - POSTGRES_PASSWORD=novivet_secret_pwd
      - POSTGRES_DB=novivet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novivet_user -d novivet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
